apiVersion: v1
kind: ConfigMap
metadata:
  name: perf-db-init
data:
  01-schema.sql: |
    -- AUTO-GENERATED FILE.

    -- This file is an auto-generated file by Ballerina persistence layer for model.
    -- Please verify the generated scripts and execute them against the target DB server.

    DROP TABLE IF EXISTS "OrderItem";
    DROP TABLE IF EXISTS "SalesOrder";
    DROP TABLE IF EXISTS "Product";
    DROP TABLE IF EXISTS "Customer";

    CREATE TABLE "Customer" (
    	"id" INT NOT NULL,
    	"name" VARCHAR(191) NOT NULL,
    	"email" VARCHAR(191) NOT NULL,
    	"country" VARCHAR(191) NOT NULL,
    	"tier" INT NOT NULL,
    	PRIMARY KEY("id")
    );

    CREATE TABLE "Product" (
    	"id" INT NOT NULL,
    	"name" VARCHAR(191) NOT NULL,
    	"description" VARCHAR(1024) NOT NULL,
    	"attr01" VARCHAR(191) NOT NULL,
    	"attr02" VARCHAR(191) NOT NULL,
    	"attr03" VARCHAR(191) NOT NULL,
    	"attr04" VARCHAR(191) NOT NULL,
    	"attr05" VARCHAR(191) NOT NULL,
    	"attr06" VARCHAR(191) NOT NULL,
    	"attr07" VARCHAR(191) NOT NULL,
    	"attr08" VARCHAR(191) NOT NULL,
    	"attr09" VARCHAR(191) NOT NULL,
    	"attr10" VARCHAR(191) NOT NULL,
    	"attr11" VARCHAR(191) NOT NULL,
    	"attr12" VARCHAR(191) NOT NULL,
    	"attr13" VARCHAR(191) NOT NULL,
    	"attr14" VARCHAR(191) NOT NULL,
    	"num01" INT NOT NULL,
    	"num02" INT NOT NULL,
    	"num03" INT NOT NULL,
    	"num04" INT NOT NULL,
    	"num05" INT NOT NULL,
    	"num06" INT NOT NULL,
    	"num07" INT NOT NULL,
    	"dec01" DECIMAL(65,30) NOT NULL,
    	"dec02" DECIMAL(65,30) NOT NULL,
    	"dec03" DECIMAL(65,30) NOT NULL,
    	"dec04" DECIMAL(65,30) NOT NULL,
    	"dec05" DECIMAL(65,30) NOT NULL,
    	"dec06" DECIMAL(65,30) NOT NULL,
    	PRIMARY KEY("id")
    );

    CREATE TABLE "SalesOrder" (
    	"id" INT NOT NULL,
    	"status" VARCHAR(191) NOT NULL,
    	"total" DECIMAL(65,30) NOT NULL,
    	"placedOn" DATE NOT NULL,
    	"customerId" INT NOT NULL,
    	FOREIGN KEY("customerId") REFERENCES "Customer"("id"),
    	PRIMARY KEY("id")
    );

    CREATE TABLE "OrderItem" (
    	"id" INT NOT NULL,
    	"sku" VARCHAR(191) NOT NULL,
    	"quantity" INT NOT NULL,
    	"price" DECIMAL(65,30) NOT NULL,
    	"salesorderId" INT NOT NULL,
    	FOREIGN KEY("salesorderId") REFERENCES "SalesOrder"("id"),
    	"productId" INT NOT NULL,
    	FOREIGN KEY("productId") REFERENCES "Product"("id"),
    	PRIMARY KEY("id")
    );



  02-seed.sql: |
    \set orders 100000
    \set fanout 10
    -- Seeds the perf model. Pass the sizes with `psql -v orders=100000 -v fanout=10`;
    -- customers = orders / 10, products = orders.
    \if :{?orders} \else \set orders 100000 \endif
    \if :{?fanout} \else \set fanout 10 \endif

    INSERT INTO "Customer" (id, name, email, country, tier)
    SELECT n, 'Customer ' || n, 'customer' || n || '@example.com',
           (ARRAY['LK', 'US', 'GB', 'DE', 'IN', 'JP', 'AU', 'BR'])[1 + n % 8], 1 + n % 4
    FROM generate_series(1, GREATEST(:orders / 10, 1)) AS n;

    INSERT INTO "SalesOrder" (id, status, total, "placedOn", "customerId")
    SELECT n, (ARRAY['NEW', 'PAID', 'SHIPPED', 'DELIVERED', 'CANCELLED'])[1 + n % 5], (n % 5000) + 0.99,
           DATE '2023-01-01' + (n % 1095), 1 + (n - 1) % GREATEST(:orders / 10, 1)
    FROM generate_series(1, :orders) AS n;

    INSERT INTO "Product"
    SELECT n, 'Product ' || n, RPAD('Description of product ' || n || ' ', 1000, 'lorem ipsum '),
           'a01-' || n, 'a02-' || n, 'a03-' || n, 'a04-' || n, 'a05-' || n, 'a06-' || n, 'a07-' || n, 'a08-' || n, 'a09-' || n, 'a10-' || n, 'a11-' || n, 'a12-' || n, 'a13-' || n, 'a14-' || n,
           n, n % 7, n % 11, n % 13, n % 17, n % 19, n % 23,
           n + 0.01, n + 0.02, n + 0.03, n + 0.04, n + 0.05, n + 0.06
    FROM generate_series(1, :orders) AS n;

    INSERT INTO "OrderItem" (id, sku, quantity, price, "salesorderId", "productId")
    SELECT n, 'SKU-' || LPAD((n % 10000)::text, 5, '0'), 1 + n % 9, (n % 300) + 0.50, 1 + (n - 1) / :fanout,
           1 + (n::bigint * 7) % :orders
    FROM generate_series(1, :orders * :fanout) AS n;

    ANALYZE;
    CREATE TABLE seed_done (done INT);

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-db
spec:
  selector:
    matchLabels:
      app: perf-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: perf-db
        load: "true"
    spec:
      containers:
        - name: perf-db
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: perf
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "psql -h 127.0.0.1 -U postgres -d perf -c 'SELECT 1 FROM seed_done'"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 360
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: init
          configMap:
            name: perf-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: perf-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: perf-db
